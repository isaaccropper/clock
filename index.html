<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Worn Flip Clock</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --card:#0a0a0a; --ink:#e9e9e9; --bg:#000; }
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:'Space Mono',monospace;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  .clock{font-size:min(1.85vw,9vh);display:flex;align-items:center;gap:.5em;position:relative}
  .sep{width:1.2em;text-align:center;font-size:5em;line-height:1;opacity:.9}
  .d{position:relative;width:6em;height:9em;perspective:60em;margin:0 .1em}
  .half{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--card);backface-visibility:hidden;box-shadow:inset 0 0 1.4em rgba(255,255,255,.04)}
  .half span{position:absolute;left:0;right:0;height:200%;line-height:1.25;text-align:center;font-size:7.2em;font-weight:700;color:var(--ink);text-shadow:.03em 0 rgba(255,0,60,.35),-.03em 0 rgba(0,200,255,.3)}
  .top{top:0;border-radius:.5em .5em 0 0;border-bottom:1px solid #000}
  .bot{bottom:0;border-radius:0 0 .5em .5em}
  .top span{top:0}
  .bot span{bottom:0}
  .f1{transform-origin:bottom;z-index:3}
  .f2{transform-origin:top;z-index:2;transform:rotateX(90deg)}
  .go .f1{animation:a1 .3s ease-in forwards}
  .go .f2{animation:a2 .3s .3s ease-out forwards}
  @keyframes a1{to{transform:rotateX(-90deg)}}
  @keyframes a2{to{transform:rotateX(0)}}
  .d::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#000;z-index:5;box-shadow:0 1px 0 #1a1a1a}

  /* wear */
  .clock .d:nth-child(3){transform:rotate(-1.2deg) translateY(.15em)}
  .clock .d:nth-child(7){transform:rotate(.9deg) translateY(-.1em)}
  .clock .d:nth-child(1)::before{content:"";position:absolute;inset:0;z-index:6;
    background:linear-gradient(112deg,transparent 46%,rgba(255,255,255,.55) 46.4%,transparent 46.9%),
               linear-gradient(130deg,transparent 60%,rgba(255,255,255,.3) 60.3%,transparent 60.7%);
    pointer-events:none}
  .clock .d:nth-child(6)::before{content:"";position:absolute;left:0;right:0;top:63%;height:.35em;z-index:6;background:#000;opacity:.8;pointer-events:none}
  .clock::before{content:"";position:absolute;inset:-.5em;z-index:10;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
  .clock::after{content:"";position:absolute;inset:-.5em;z-index:11;pointer-events:none;opacity:.22;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
  .glitch{animation:g .18s steps(2) 1}
  @keyframes g{0%{transform:translate(.4em,0) skewX(6deg);filter:hue-rotate(40deg)}50%{transform:translate(-.5em,.1em) skewX(-8deg)}100%{transform:none}}
</style>
</head>
<body>
  <div class="clock" id="b"></div>

<script>
// Counts down to the first frame: Fri 10/23/26 2:00 PM Pacific.
var TARGET = new Date('2026-10-23T14:00:00-07:00');

function build(root){
  var cells=[];
  var layout='ddd:dd:dd';
  for(var i=0;i<layout.length;i++){
    if(layout[i]===':'){var s=document.createElement('div');s.className='sep';s.textContent=':';root.appendChild(s);continue;}
    var d=document.createElement('div');d.className='d';
    d.innerHTML='<div class="half top t"><span>0</span></div><div class="half bot b"><span>0</span></div>'+
                '<div class="half top f1"><span>0</span></div><div class="half bot f2"><span>0</span></div>';
    d.dataset.v='0';root.appendChild(d);cells.push(d);
  }
  return cells;
}
function set(d,v){
  if(d.dataset.v===v)return;
  var old=d.dataset.v;d.dataset.v=v;
  d.querySelector('.t span').textContent=v;
  d.querySelector('.f1 span').textContent=old;
  d.querySelector('.f2 span').textContent=v;
  d.classList.remove('go');void d.offsetWidth;d.classList.add('go');
  setTimeout(function(){d.querySelector('.b span').textContent=v;},300);
}
var clock=document.getElementById('b'), B=build(clock);
function tick(){
  var ms = TARGET-Date.now();
  if(ms<0)ms=0;
  var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  var str=String(h).padStart(3,'0')+String(m).padStart(2,'0')+String(sec).padStart(2,'0');
  for(var i=0;i<7;i++){set(B[i],str[i]);}
}
tick();setInterval(tick,250);
setInterval(function(){clock.classList.remove('glitch');void clock.offsetWidth;clock.classList.add('glitch');},6500);
</script>
</body>
</html>
